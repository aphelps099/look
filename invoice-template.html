<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .invoice-container {
            border: 1px solid #ddd;
            padding: 40px;
            background: #fff;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #2c3e50;
        }

        .invoice-section {
            margin-bottom: 30px;
        }

        .invoice-field {
            margin-bottom: 15px;
        }

        .invoice-field label {
            font-weight: bold;
            display: inline-block;
            min-width: 120px;
        }

        .invoice-field span {
            display: inline-block;
        }

        .description {
            margin-top: 10px;
            padding: 15px;
            background: #f9f9f9;
            border-left: 3px solid #3498db;
        }

        .payment-section {
            border-top: 2px solid #eee;
            padding-top: 30px;
            margin-top: 30px;
        }

        .payment-section h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .payment-info {
            margin-bottom: 25px;
            line-height: 1.8;
        }

        .paypal-button-container {
            text-align: center;
            margin: 30px 0;
        }

        .thank-you {
            text-align: center;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #eee;
            font-style: italic;
            color: #7f8c8d;
        }

        @media print {
            body {
                margin: 0;
            }
            .invoice-container {
                border: none;
            }
        }
    </style>
</head>
<body>
    <div class="invoice-container">
        <h1>INVOICE</h1>

        <div class="invoice-section">
            <div class="invoice-field">
                <label>Client Name:</label>
                <span>[CLIENT NAME]</span>
            </div>

            <div class="invoice-field">
                <label>Date:</label>
                <span>[DATE]</span>
            </div>

            <div class="invoice-field">
                <label>Project:</label>
                <span>[PROJECT NAME]</span>
            </div>

            <div class="invoice-field">
                <label>Description:</label>
            </div>
            <div class="description">
                [Short description of the project and services provided]
            </div>
        </div>

        <div class="payment-section">
            <h2>Payment Information</h2>

            <div class="payment-info">
                <strong>Check Payable To:</strong><br>
                [Your Name/Business Name]<br>
                [Address Line 1]<br>
                [Address Line 2]<br><br>

                <strong>Contact:</strong><br>
                [Email Address]<br>
                [Phone Number]
            </div>

            <div class="paypal-button-container">
                <!-- PayPal Button Code -->
                <form action="https://www.paypal.com/cgi-bin/webscr" method="post" target="_top">
                    <input type="hidden" name="cmd" value="_xclick">
                    <input type="hidden" name="business" value="YOUR_PAYPAL_EMAIL@example.com">
                    <input type="hidden" name="item_name" value="Invoice Payment">
                    <input type="hidden" name="amount" value="0.00">
                    <input type="hidden" name="currency_code" value="USD">
                    <input type="image" src="https://www.paypalobjects.com/en_US/i/btn/btn_paynow_LG.gif" border="0" name="submit" alt="PayPal - The safer, easier way to pay online!">
                </form>
            </div>
        </div>

        <div class="thank-you">
            Thank you for your business!
        </div>
    </div>
</body>
</html>
